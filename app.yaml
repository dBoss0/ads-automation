command:
  - streamlit
  - run
  - streamlit_app.py
  - --server.port
  - "8080"
  - --server.address
  - "0.0.0.0"
  - --server.headless
  - "true"
  - --server.enableCORS
  - "false"
  - --server.enableXsrfProtection
  - "false"

env:
  - name: PYTHONDONTWRITEBYTECODE
    value: "1"

resources:
  - name: claude-opus-5
    serving_endpoint:
      name: databricks-claude-opus-5
      permission: CAN_QUERY
